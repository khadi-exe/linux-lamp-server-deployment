<VirtualHost *:80>
	ServerName khadimul-islam.me
	DocumentRoot /var/www/khadimul-islam
	<Directory /var/www/khadimul-islam>
		AllowOverride All
		Require all granted
	</Directory>
	ErrorLog ${APACHE_LOG_DIR}/khadimul-islam_error.log
	CustomLog ${APACHE_LOG_DIR}/khadimul-islam_access.log combined
</VirtualHost>
